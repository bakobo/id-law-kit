name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # Action versions are pinned to node24 runtimes; node20 is deprecated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poppler
        # lawcorpus/pdf.py shells out to pdftotext; the PDF tests skip without it, which would
        # quietly drop coverage below the gate rather than failing loudly.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test with branch coverage
        # 100% of new code is the standing bar (AGENTS.md). The network-marked test is
        # deselected by default so CI does not depend on Brussels being up.
        run: python -m pytest --cov --cov-fail-under=100

  live-sources:
    # The corpus repos are worthless if the upstream endpoints move. This job is the canary:
    # it is allowed to fail without blocking a merge, but a failure means a fetcher needs work.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e '.[dev,browser]'

      - name: Install the browser the canaries drive
        # The Thai canaries need a real browser. `--with-deps` pulls the shared libraries
        # headless Chromium needs on a bare runner.
        run: python -m playwright install --with-deps chromium

      - name: Check the live endpoints still answer
        # EUR-Lex, plus the Thai sources: the Royal Gazette serving document bytes while
        # challenging its HTML routes, and bora.dopa.go.th rendering client-side. A failure
        # here means a source changed posture, which is exactly what we want to hear about.
        run: python -m pytest -m network
