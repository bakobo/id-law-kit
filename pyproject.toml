[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lawcorpus"
version = "0.1.0"
description = "Corpus, manifest, and citation tooling for the Bakobo identity-law research repos"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bakobo" }]
dependencies = ["defusedxml>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
# `lawcorpus.fetch.browser` only. Most corpus repos never launch a browser and should not pay
# ~170 MB of cached binaries for one that is needed by two secondary Asian sources — see
# this.i @2sc5rmg4. After installing the extra, fetch the binaries with `playwright install
# chromium`. The pin's floor is the oldest release whose sync API this module was written
# against; it was developed on 1.62.0, which is the release matching the chromium build
# cached on the development box.
browser = ["playwright>=1.44"]

[project.scripts]
lawcite = "lawcorpus.cite:main"

[tool.hatch.build.targets.wheel]
packages = ["lawcorpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: hits the live network; deselected by default"]

[tool.coverage.run]
branch = true
source = ["lawcorpus"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
